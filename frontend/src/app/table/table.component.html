<div class="table-container">
  <span class="shop-count">{{ coffeeShops().length }} Cafés found</span>

  <table mat-table [dataSource]="sortedShops()" class="coffee-table">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let shop">{{ shop.name }}</td>
    </ng-container>

    <ng-container matColumnDef="website">
      <th mat-header-cell *matHeaderCellDef>Website</th>
      <td mat-cell *matCellDef="let shop">
        @if (shop.website.url) {
          <button matButton (click)="openUrl(shop.website.url)">Website</button>
        } @else {
          <span class="muted">—</span>
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="menu">
      <th mat-header-cell *matHeaderCellDef>Menu</th>
      <td mat-cell *matCellDef="let shop">
        @if (shop.menu.menu_url) {
          <button matButton (click)="openUrl(shop.menu.menu_url)">Menu</button>
        } @else {
          <span class="muted">—</span>
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"
        [class.row-inaccessible]="isInaccessible(row)"></tr>
  </table>

  @if (!loading() && coffeeShops().length === 0) {
    <p class="empty">Keine Cafés gefunden.</p>
  }
</div>

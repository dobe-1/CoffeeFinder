<div class="map-container">
    <div id="map"></div>
    <div class="coffee-shop-list">
        <span class="shop-count">{{ coffeeShops().length }} Cafés found</span>

        @for (entry of shopsWithWebsite(); track entry.index) {
        <mat-card appearance="outlined" class="shop-card"
                  [id]="'shop-card-' + entry.index"
                  [class.selected]="selectedIndex() === entry.index"
                  (click)="selectShop(entry.index)">
            <mat-card-header>
                <mat-card-title> {{ entry.shop.name }} </mat-card-title>
            </mat-card-header>
            <mat-card-actions>
                <button matButton [disabled]="!entry.shop.website.url" (click)="openUrl(entry.shop.website.url)">Website</button>
                <button matButton [disabled]="!entry.shop.menu.menu_url" (click)="openUrl(entry.shop.menu.menu_url)">Menu</button>
            </mat-card-actions>
        </mat-card>
        }

        @if (shopsWithoutWebsite().length) {
        <span class="shop-section-label">Ohne Website</span>
        @for (entry of shopsWithoutWebsite(); track entry.index) {
        <mat-card appearance="outlined" class="shop-card shop-card-no-website"
                  [id]="'shop-card-' + entry.index"
                  [class.selected]="selectedIndex() === entry.index"
                  (click)="selectShop(entry.index)">
            <mat-card-header>
                <mat-card-title> {{ entry.shop.name }} </mat-card-title>
            </mat-card-header>
        </mat-card>
        }
        }
    </div>

</div>
